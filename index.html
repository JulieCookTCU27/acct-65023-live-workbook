<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Excel-style live workbook for ACCT 65023 Managerial Accounting: cases with labeled formulas, practice mode, Goal Seek, and CVP templates.">
<title>ACCT 65023 Live Workbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap">
<style>
/* Base reset (stands in for the artifact host skeleton) */
:root{color-scheme:light}
html,body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
/* Layout: Excel-like work surface. Sheet list at left, formula bar + grid in the middle, cell inspector at right. TCU tokens. */
:root{
  --bg:#faf9fb; --surface:#ffffff; --ink:#1c1b1f; --ink-2:#45434b; --ink-3:#6e6b76;
  --line:#e3e1e8; --line-strong:#c8c5d0;
  --brand:#4d1979; --brand-2:#7b52a0; --brand-fill:#4d1979; --brand-fill-hover:#3b1060; --on-brand:#ffffff;
  --tint:#f5f1f9; --tint-2:#eae2f1; --tint-3:#d7c8e5;
  --input:#1f4fb0; --good:#1e6b45; --good-bg:#e6f2eb; --bad:#9b3b2e; --bad-bg:#f9eae7; --warn:#8a6d1f; --warn-bg:#faf3de;
  --font:"Inter",Calibri,"Segoe UI",-apple-system,sans-serif;
  --shadow:0 1px 3px rgba(28,27,31,.08);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#141218; --surface:#1c1a21; --ink:#ece9f1; --ink-2:#c9c5d1; --ink-3:#a29eab;
  --line:#34303b; --line-strong:#4b4654;
  --brand:#cdb6ea; --brand-2:#b394da; --brand-fill:#5d2a8f; --brand-fill-hover:#6c36a1; --on-brand:#ffffff;
  --tint:#241d2d; --tint-2:#30263c; --tint-3:#44355a;
  --input:#93b4ff; --good:#86d3a8; --good-bg:#17352a; --bad:#f2a596; --bad-bg:#3d2320; --warn:#e3c46d; --warn-bg:#352d16;
  --shadow:0 1px 3px rgba(0,0,0,.4); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#141218; --surface:#1c1a21; --ink:#ece9f1; --ink-2:#c9c5d1; --ink-3:#a29eab;
  --line:#34303b; --line-strong:#4b4654;
  --brand:#cdb6ea; --brand-2:#b394da; --brand-fill:#5d2a8f; --brand-fill-hover:#6c36a1; --on-brand:#ffffff;
  --tint:#241d2d; --tint-2:#30263c; --tint-3:#44355a;
  --input:#93b4ff; --good:#86d3a8; --good-bg:#17352a; --bad:#f2a596; --bad-bg:#3d2320; --warn:#e3c46d; --warn-bg:#352d16;
  --shadow:0 1px 3px rgba(0,0,0,.4); color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
.page{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px;max-width:1680px;margin:0 auto}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 24px;padding-bottom:14px;border-bottom:2px solid var(--brand);margin-bottom:20px}
.top .mark{font-weight:700;color:var(--brand);letter-spacing:.06em;text-transform:uppercase}
.top h1{margin:2px 0 0;font-size:30px;line-height:1.15;font-weight:700;text-wrap:balance}
.top .meta{color:var(--ink-2);text-align:right}
.layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:28px}
nav.side{position:sticky;top:12px;align-self:start;max-height:calc(100vh - 24px);overflow:auto;padding-right:4px}
nav.side h2{font-size:16px;margin:18px 0 6px;color:var(--ink-3);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
nav.side h2:first-child{margin-top:0}
nav.side button{display:block;width:100%;text-align:left;border:0;background:none;padding:7px 10px;border-radius:6px;cursor:pointer;line-height:1.3}
nav.side button small{display:block;color:var(--ink-3);font-size:16px}
nav.side button:hover{background:var(--tint)}
nav.side button[aria-current="true"]{background:var(--brand-fill);color:var(--on-brand)}
nav.side button[aria-current="true"] small{color:var(--on-brand);opacity:.85}
.mobile-only{display:none}
main{min-width:0}
.eyebrow{color:var(--brand);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.shead h2{font-size:30px;line-height:1.2;margin:2px 0 6px;text-wrap:balance}
.shead p{margin:0 0 10px;max-width:78ch;color:var(--ink-2)}
details.qs{border:1px solid var(--line);border-radius:6px;background:var(--surface);margin:10px 0 14px}
details.qs summary{cursor:pointer;padding:10px 14px;font-weight:600}
details.qs ol{margin:0;padding:0 14px 12px 36px;display:grid;gap:6px}
details.qs li{max-width:90ch}
.chipbtn{border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:1px 10px;cursor:pointer;margin-left:6px;white-space:nowrap}
.chipbtn:hover{background:var(--tint)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0 10px}
.btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:6px;padding:6px 12px;cursor:pointer}
.btn:hover{background:var(--tint)}
.btn[aria-pressed="true"]{background:var(--brand-fill);border-color:var(--brand-fill);color:var(--on-brand)}
.btn.warn{border-color:var(--bad);color:var(--bad)}
.toolbar .spacer{flex:1}
.score{color:var(--ink-2)}
:focus-visible{outline:2px solid var(--brand-2);outline-offset:2px}
.panel{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:12px 14px;margin-bottom:10px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:end}
.panel label{display:grid;gap:2px;color:var(--ink-2)}
.panel input{border:1px solid var(--line-strong);border-radius:6px;padding:5px 8px;background:var(--surface);width:130px}
.panel .msg{flex-basis:100%;margin:0;color:var(--ink-2)}
.fbar{display:flex;align-items:stretch;border:1px solid var(--line-strong);border-radius:6px;background:var(--surface);overflow:hidden;margin-bottom:10px}
.fbar .name{min-width:88px;padding:6px 10px;border-right:1px solid var(--line);font-weight:600;display:flex;align-items:center;font-variant-numeric:tabular-nums}
.fbar .fx{padding:6px 10px;border-right:1px solid var(--line);color:var(--brand);font-weight:700;display:flex;align-items:center}
.fbar input{flex:1;min-width:0;border:0;padding:6px 10px;background:transparent;outline:none;font-variant-numeric:tabular-nums}
.fbar:focus-within{border-color:var(--brand-2);box-shadow:0 0 0 1px var(--brand-2)}
.work{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
.gridwrap{overflow:auto;max-height:72vh;border:1px solid var(--line-strong);border-radius:6px;background:var(--surface)}
.gridwrap:focus-visible{outline:2px solid var(--brand-2)}
table.grid{border-collapse:separate;border-spacing:0;font-variant-numeric:tabular-nums}
.grid th,.grid td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:5px 9px;height:36px;white-space:nowrap}
.grid thead th{position:sticky;top:0;z-index:3;background:var(--tint);color:var(--ink-2);font-weight:600;text-align:center}
.grid th.rn{position:sticky;left:0;z-index:2;background:var(--tint);color:var(--ink-3);font-weight:400;text-align:right;min-width:44px}
.grid thead th.rn{z-index:4}
.grid td{min-width:128px;text-align:right;cursor:cell;position:relative;background:var(--surface)}
.grid td.ca{min-width:300px;max-width:380px;text-align:left;white-space:normal}
.grid td.mean{min-width:280px;max-width:420px;white-space:normal;text-align:left;color:var(--ink-3);cursor:default;background:var(--bg)}
.grid thead th.meanh{text-align:left}
.grid td.txt{text-align:left}
.grid td.in{color:var(--input)}
.grid td.fx::after{content:"";position:absolute;top:0;right:0;border-style:solid;border-width:0 7px 7px 0;border-color:transparent var(--brand-2) transparent transparent}
.grid td.edited::before{content:"";position:absolute;top:3px;left:3px;width:6px;height:6px;border-radius:50%;background:var(--warn)}
.grid td.neg{color:var(--bad)}
.grid td.err{color:var(--bad);font-weight:600}
.grid tr.h td{background:var(--tint);color:var(--brand);font-weight:700;text-align:left;white-space:normal}
.grid tr.t td.span{color:var(--ink-2);text-align:left;white-space:normal;max-width:900px}
.grid tr.c td{font-weight:600;color:var(--ink-2);border-bottom:2px solid var(--brand);text-align:right}
.grid tr.c td.ca{text-align:left}
.grid tr.total td:not(.mean):not(.ca){font-weight:700;border-top:1px solid var(--ink-2)}
.grid tr.total td.ca{font-weight:700}
.grid td.sel{outline:2px solid var(--brand);outline-offset:-2px;z-index:1}
.grid td.prec{background:var(--tint-2)}
.grid td.prec::before{content:"";position:absolute;inset:2px;border:1px dashed var(--brand-2);pointer-events:none}
.grid td.mask{background:var(--warn-bg);color:var(--ink-3)}
.grid td.ok{background:var(--good-bg);color:var(--good);font-weight:600}
.grid td.no{background:var(--bad-bg);color:var(--bad);font-weight:600}
.grid td.showf{text-align:left;color:var(--brand)}
.insp{position:sticky;top:12px;border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:14px;display:grid;gap:10px;box-shadow:var(--shadow);max-height:calc(100vh - 24px);overflow:auto}
.insp .addr{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.insp .addr b{font-size:20px}
.tag{display:inline-block;border-radius:999px;padding:0 10px;background:var(--tint);color:var(--brand);font-weight:600}
.tag.in{background:var(--tint);color:var(--input)}
.tag.p{background:var(--warn-bg);color:var(--warn)}
.tag.e{background:var(--warn-bg);color:var(--warn)}
.insp h3{margin:0;font-size:16px;color:var(--ink-3);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.insp .lab{font-weight:600}
.insp code,.code{font-family:var(--font);font-variant-numeric:tabular-nums;background:var(--tint);border-radius:3px;padding:4px 8px;display:block;white-space:pre-wrap;word-break:break-word;color:var(--ink)}
.insp .res{font-size:20px;font-weight:700}
.insp p{margin:0}
.insp .why{color:var(--ink-2)}
.insp .mis{background:var(--bad-bg);color:var(--ink);border-radius:6px;padding:8px 10px}
.insp .mis b{color:var(--bad)}
.precs{display:flex;flex-wrap:wrap;gap:6px}
.precs button{border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:1px 10px;cursor:pointer;text-align:left}
.precs button:hover{background:var(--tint)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--ink-2);margin-top:10px}
.sw{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:6px;border:1px solid var(--line-strong)}
.chart{margin-top:16px;border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:12px 14px}
.chart h3{margin:0 0 4px;font-size:18px}
.chart svg{width:100%;height:auto;display:block}
.chart .keys{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--ink-2)}
.chart .keys i{display:inline-block;width:18px;height:3px;vertical-align:middle;margin-right:6px}
.special{min-width:0}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
table.ref{border-collapse:collapse;width:100%;min-width:860px}
table.ref th{background:var(--brand-fill);color:var(--on-brand);text-align:left;padding:8px 10px;font-weight:600;vertical-align:bottom}
table.ref td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.ref tr.grp td{background:var(--tint);color:var(--brand);font-weight:700}
table.ref .f{font-weight:600;white-space:nowrap}
table.ref select{border:1px solid var(--line-strong);border-radius:6px;padding:3px 6px;background:var(--surface)}
table.ref td.okc{background:var(--good-bg)}
table.ref td.noc{background:var(--bad-bg)}
.keynote{color:var(--ink-2)}
.notebox{border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:12px 14px;margin:12px 0;max-width:90ch}
.notebox h3{margin:0 0 6px;font-size:18px}
.notebox ul{margin:0;padding-left:20px;display:grid;gap:4px}
.kbd{border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:4px;padding:0 6px;background:var(--surface)}
@media (max-width:1280px){ .work{grid-template-columns:minmax(0,1fr)} .insp{position:static;max-height:none} }
@media (max-width:900px){
  .layout{grid-template-columns:minmax(0,1fr)}
  nav.side{display:none}
  .mobile-only{display:block}
  #sheetSel{width:100%;border:1px solid var(--line-strong);border-radius:6px;padding:8px;background:var(--surface);margin-bottom:12px}
  .top .meta{text-align:left}
  .top h1,.shead h2{font-size:24px}
  .gridwrap{max-height:62vh}
  .grid td.ca{min-width:210px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="page">
  <header class="top">
    <div>
      <div class="mark">TCU Neeley EMBA</div>
      <h1>ACCT 65023 Live Workbook</h1>
    </div>
  </header>
  <div class="layout">
    <nav class="side" id="side" aria-label="Sheets"></nav>
    <main>
      <select id="sheetSel" class="mobile-only" aria-label="Choose a sheet"></select>
      <section class="shead" id="shead"></section>
      <div id="gridArea">
        <div class="toolbar">
          <button class="btn" id="bPractice" aria-pressed="false" title="Hide worked answers and check your own">Practice mode</button>
          <button class="btn" id="bFormulas" aria-pressed="false" title="Ctrl + `">Show formulas</button>
          <button class="btn" id="bGoal">Goal Seek</button>
          <button class="btn" id="bCopyF">Copy with formulas</button>
          <button class="btn" id="bCopyV">Copy values</button>
          <span class="spacer"></span>
          <span class="score" id="score"></span>
          <button class="btn" id="bReset">Reset sheet</button>
        </div>
        <div class="panel" id="gsPanel" hidden>
          <label for="gsSet">Set cell<input id="gsSet" placeholder="B30"></label>
          <label for="gsTo">To value<input id="gsTo" placeholder="0"></label>
          <label for="gsBy">By changing cell<input id="gsBy" placeholder="B8"></label>
          <button class="btn" id="gsRun" aria-pressed="true">Solve</button>
          <button class="btn" id="gsClose">Close</button>
          <p class="msg" id="gsMsg">Same as Excel: Data → What-If Analysis → Goal Seek. The changing cell must be an input (blue).</p>
        </div>
        <div class="fbar">
          <div class="name" id="nameBox">—</div>
          <div class="fx" aria-hidden="true">fx</div>
          <input id="fInput" aria-label="Formula bar" autocomplete="off" spellcheck="false" placeholder="Select a cell. Type a number, text, or a formula starting with =">
        </div>
        <div class="work">
          <div>
            <div class="gridwrap" id="gridWrap" tabindex="0" aria-label="Spreadsheet grid"><table class="grid" id="grid"></table></div>
            <div class="legend">
              <span><span class="sw" style="background:var(--surface);border-color:var(--input);box-shadow:inset 0 0 0 7px var(--surface)"></span><span style="color:var(--input);font-weight:600">Blue</span> = input you can change</span>
              <span><span class="sw" style="background:linear-gradient(225deg,var(--brand-2) 0 30%,var(--surface) 30%)"></span>Formula</span>
              <span><span class="sw" style="background:var(--tint-2)"></span>Feeds the selected formula</span>
              <span><span class="sw" style="background:var(--warn-bg)"></span>Practice: your answer</span>
              <span><span class="sw" style="background:var(--warn);border-radius:50%"></span>You edited it</span>
            </div>
            <div id="chart"></div>
          </div>
          <aside class="insp" id="insp" aria-live="polite"></aside>
        </div>
      </div>
      <div class="special" id="special" hidden></div>
    </main>
  </div>
</div>

<script>
"use strict";
/* ============================================================
   Formula engine: A1 refs, ranges, cross-sheet refs, Excel functions
   ============================================================ */
class Err{constructor(c){this.code=c}}
const isErr=x=>x instanceof Err;
const colName=i=>{let s='';i++;while(i>0){const m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=Math.floor((i-1)/26)}return s};
const colIdx=s=>{let n=0;for(const ch of s)n=n*26+(ch.charCodeAt(0)-64);return n-1};
const splitAddr=a=>{const m=/^([A-Z]+)(\d+)$/.exec(a);return m?{c:colIdx(m[1]),r:+m[2],cl:m[1]}:null};

function tokenize(s){
  const toks=[];let i=0;
  const refRe=/^(?:('(?:[^']|'')+'|[A-Za-z_][A-Za-z0-9_]*)!)?(\$?[A-Za-z]{1,3}\$?\d+)(?![A-Za-z0-9_(])/;
  while(i<s.length){
    const ch=s[i];
    if(/\s/.test(ch)){i++;continue}
    const rest=s.slice(i);let m;
    if(ch==='"'){let j=i+1,str='';while(j<s.length){if(s[j]==='"'){if(s[j+1]==='"'){str+='"';j+=2;continue}break}str+=s[j++]}
      toks.push({t:'str',v:str,s:i,e:j+1});i=j+1;continue}
    if((m=/^(\d+\.?\d*(?:[eE][+-]?\d+)?|\.\d+)/.exec(rest))){toks.push({t:'num',v:parseFloat(m[1]),s:i,e:i+m[1].length});i+=m[1].length;continue}
    if((m=refRe.exec(rest))){let sh=m[1]||null;if(sh&&sh[0]==="'")sh=sh.slice(1,-1).replace(/''/g,"'");
      toks.push({t:'ref',sheet:sh,a:m[2].replace(/\$/g,'').toUpperCase(),s:i,e:i+m[0].length});i+=m[0].length;continue}
    if((m=/^[A-Za-z_][A-Za-z0-9_.]*/.exec(rest))){toks.push({t:'id',v:m[0].toUpperCase(),s:i,e:i+m[0].length});i+=m[0].length;continue}
    if((m=/^(<=|>=|<>|[-+*/^&%=<>(),:])/.exec(rest))){toks.push({t:'op',v:m[1],s:i,e:i+m[1].length});i+=m[1].length;continue}
    throw new Err('#PARSE!');
  }
  return toks;
}
const astCache=new Map();
function parse(s){
  if(astCache.has(s))return astCache.get(s);
  const toks=tokenize(s);let p=0;
  const isOp=v=>toks[p]&&toks[p].t==='op'&&toks[p].v===v;
  const next=()=>toks[p++];
  const expect=v=>{if(!isOp(v))throw new Err('#PARSE!');p++};
  const CMP=['=','<>','<','>','<=','>='];
  function cmp(){let a=cat();while(toks[p]&&toks[p].t==='op'&&CMP.includes(toks[p].v)){const op=next().v;a={type:'bin',op,a,b:cat()}}return a}
  function cat(){let a=add();while(isOp('&')){p++;a={type:'bin',op:'&',a,b:add()}}return a}
  function add(){let a=mul();while(isOp('+')||isOp('-')){const op=next().v;a={type:'bin',op,a,b:mul()}}return a}
  function mul(){let a=pw();while(isOp('*')||isOp('/')){const op=next().v;a={type:'bin',op,a,b:pw()}}return a}
  function pw(){let a=un();while(isOp('^')){p++;a={type:'bin',op:'^',a,b:un()}}return a}
  function un(){if(isOp('-')){p++;return{type:'neg',a:un()}}if(isOp('+')){p++;return un()}return post()}
  function post(){let a=prim();while(isOp('%')){p++;a={type:'pct',a}}return a}
  function prim(){
    const t=next();if(!t)throw new Err('#PARSE!');
    if(t.t==='num')return{type:'num',v:t.v};
    if(t.t==='str')return{type:'str',v:t.v};
    if(t.t==='ref'){if(isOp(':')&&toks[p+1]&&toks[p+1].t==='ref'){p++;const t2=next();return{type:'range',sheet:t.sheet,a:t.a,b:t2.a}}return{type:'ref',sheet:t.sheet,a:t.a}}
    if(t.t==='id'){
      if(t.v==='TRUE')return{type:'bool',v:true};
      if(t.v==='FALSE')return{type:'bool',v:false};
      if(isOp('(')){p++;const args=[];if(!isOp(')')){args.push(cmp());while(isOp(',')){p++;args.push(cmp())}}expect(')');return{type:'fn',name:t.v,args}}
      throw new Err('#NAME?');
    }
    if(t.t==='op'&&t.v==='('){const e=cmp();expect(')');return e}
    throw new Err('#PARSE!');
  }
  const ast=cmp();if(p<toks.length)throw new Err('#PARSE!');
  astCache.set(s,ast);return ast;
}
function parseLiteral(s){
  if(typeof s!=='string')return s;
  const t=s.trim();if(t==='')return'';
  let x=t,neg=false,pc=false;
  if(/^\(.*\)$/.test(x)){neg=true;x=x.slice(1,-1)}
  if(x.endsWith('%')){pc=true;x=x.slice(0,-1)}
  x=x.replace(/[$,\s]/g,'');
  if(x.startsWith('-')){neg=!neg;x=x.slice(1)}
  if(/^(\d+\.?\d*|\.\d+)([eE][+-]?\d+)?$/.test(x)){let n=parseFloat(x);if(pc)n/=100;return neg?-n:n}
  return t;
}
function toNum(v){
  if(isErr(v))return v;if(v&&v.range)return new Err('#VALUE!');
  if(v===''||v==null)return 0;if(typeof v==='number')return v;if(typeof v==='boolean')return v?1:0;
  const x=parseLiteral(v);return typeof x==='number'?x:new Err('#VALUE!');
}
const truthy=v=>typeof v==='string'?v.toUpperCase()==='TRUE':!!toNum(v);
function expandRange(a,b){const A=splitAddr(a),B=splitAddr(b);const out=[];
  for(let r=Math.min(A.r,B.r);r<=Math.max(A.r,B.r);r++)for(let c=Math.min(A.c,B.c);c<=Math.max(A.c,B.c);c++)out.push(colName(c)+r);return out}
function sidFromTab(tab,ctx){if(!tab)return ctx;const s=ORDER.find(x=>SH[x].tab.toLowerCase()===tab.toLowerCase());if(!s)throw new Err('#REF!');return s}
function ev(n,ctx){
  switch(n.type){
    case'num':case'str':case'bool':return n.v;
    case'ref':return getVal(sidFromTab(n.sheet,ctx),n.a);
    case'range':{const sid=sidFromTab(n.sheet,ctx);return{range:true,vals:expandRange(n.a,n.b).map(a=>getVal(sid,a))}}
    case'neg':{const x=toNum(ev(n.a,ctx));return isErr(x)?x:-x}
    case'pct':{const x=toNum(ev(n.a,ctx));return isErr(x)?x:x/100}
    case'bin':return bin(n.op,ev(n.a,ctx),ev(n.b,ctx));
    case'fn':return callFn(n.name,n.args,ctx);
  }
  return new Err('#ERROR!');
}
function bin(op,a,b){
  if(isErr(a))return a;if(isErr(b))return b;
  if(a&&a.range||b&&b.range)return new Err('#VALUE!');
  if(op==='&')return String(a===''?'':typeof a==='number'?+a.toFixed(10):a)+String(b===''?'':typeof b==='number'?+b.toFixed(10):b);
  if(['=','<>','<','>','<=','>='].includes(op)){
    let r;
    if((typeof a==='string'&&a!=='')||(typeof b==='string'&&b!=='')){const x=String(a).toLowerCase(),y=String(b).toLowerCase();r=x<y?-1:x>y?1:0}
    else{const x=toNum(a),y=toNum(b);r=Math.abs(x-y)<1e-12?0:x<y?-1:1}
    return{'=':r===0,'<>':r!==0,'<':r<0,'>':r>0,'<=':r<=0,'>=':r>=0}[op];
  }
  const x=toNum(a),y=toNum(b);if(isErr(x))return x;if(isErr(y))return y;
  switch(op){case'+':return x+y;case'-':return x-y;case'*':return x*y;case'/':return y===0?new Err('#DIV/0!'):x/y;case'^':return Math.pow(x,y)}
  return new Err('#ERROR!');
}
const flat=vals=>{const o=[];vals.forEach(v=>{if(v&&v.range)o.push(...v.vals);else o.push(v)});return o};
function matchCrit(v,c){
  if(typeof c==='string'){const m=/^(<=|>=|<>|<|>|=)(.*)$/.exec(c);if(m){const r=bin(m[1],v,parseLiteral(m[2]));return r===true}
    return String(v).toLowerCase()===c.toLowerCase()}
  return typeof v==='number'&&Math.abs(v-c)<1e-12;
}
function callFn(name,args,ctx){
  if(name==='IF'){const c=ev(args[0],ctx);if(isErr(c))return c;return truthy(c)?(args[1]?ev(args[1],ctx):true):(args[2]?ev(args[2],ctx):false)}
  if(name==='IFERROR'){const v=ev(args[0],ctx);return isErr(v)?(args[1]?ev(args[1],ctx):''):v}
  const vals=args.map(a=>ev(a,ctx));
  const nums=()=>{const f=flat(vals);for(const v of f)if(isErr(v))throw v;return f.filter(v=>typeof v==='number')};
  const n1=i=>{const x=toNum(vals[i]);if(isErr(x))throw x;return x};
  const rnd=(x,d,mode)=>{const k=Math.pow(10,d||0);const s=Math.sign(x),a=Math.abs(x)*k;const r=mode==='up'?Math.ceil(a-1e-9):mode==='down'?Math.floor(a+1e-9):Math.round(a+1e-9);return s*r/k};
  switch(name){
    case'SUM':return nums().reduce((s,x)=>s+x,0);
    case'AVERAGE':{const n=nums();return n.length?n.reduce((s,x)=>s+x,0)/n.length:new Err('#DIV/0!')}
    case'MIN':{const n=nums();return n.length?Math.min(...n):0}
    case'MAX':{const n=nums();return n.length?Math.max(...n):0}
    case'COUNT':return nums().length;
    case'ABS':return Math.abs(n1(0));
    case'SQRT':{const x=n1(0);return x<0?new Err('#NUM!'):Math.sqrt(x)}
    case'POWER':return Math.pow(n1(0),n1(1));
    case'ROUND':return rnd(n1(0),args[1]?n1(1):0);
    case'ROUNDUP':return rnd(n1(0),args[1]?n1(1):0,'up');
    case'ROUNDDOWN':return rnd(n1(0),args[1]?n1(1):0,'down');
    case'AND':return flat(vals).every(truthy);
    case'OR':return flat(vals).some(truthy);
    case'NOT':return !truthy(vals[0]);
    case'SUMIF':{const r=vals[0],c=vals[1],sr=vals[2]||vals[0];if(!r||!r.range||!sr.range)return new Err('#VALUE!');let s=0;r.vals.forEach((v,i)=>{if(matchCrit(v,c)){const x=sr.vals[i];if(typeof x==='number')s+=x}});return s}
    case'SUMPRODUCT':{const rs=vals.filter(v=>v&&v.range);if(!rs.length)return new Err('#VALUE!');let s=0;for(let i=0;i<rs[0].vals.length;i++){let p=1;for(const r of rs){const x=toNum(r.vals[i]);p*=isErr(x)?0:x}s+=p}return s}
  }
  return new Err('#NAME?');
}

/* ============================================================
   Formatting
   ============================================================ */
const nf=(v,d)=>v.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const money=(v,d)=>{const s='$'+nf(Math.abs(v),d);return v<0?'('+s+')':s};
const FMT={
  '$0':v=>money(v,0),'$2':v=>money(v,2),'$4':v=>money(v,4),'m2':v=>(v<0?'(':'')+'$'+nf(Math.abs(v),2)+'m'+(v<0?')':''),
  'n0':v=>nf(v,0),'n1':v=>nf(v,1),'n2':v=>nf(v,2),'n4':v=>nf(v,4),
  '%0':v=>nf(v*100,0)+'%','%1':v=>nf(v*100,1)+'%','%2':v=>nf(v*100,2)+'%',
  'x2':v=>nf(v,2)+'×',
  'g':v=>Number.isInteger(v)?nf(v,0):v.toLocaleString('en-US',{maximumFractionDigits:4})
};
function display(v,fmt){
  if(isErr(v))return v.code;if(v===''||v==null)return'';
  if(typeof v==='boolean')return v?'TRUE':'FALSE';
  if(v&&v.range)return'#VALUE!';
  if(typeof v==='string')return v;
  if(!isFinite(v))return'#NUM!';
  if(Math.abs(v)<1e-9)v=0;
  return(FMT[fmt]||FMT.g)(v);
}

const H=t=>['h',t],T=t=>['t',t],C=(...h)=>['c','',...h],B=()=>['b'];

def({id:'lev',tab:'Leverage',group:'Session 2 · CVP',title:'Cost structure and leverage',sub:'Operating leverage · crossover',
  intro:'Three companies with the same $500,000 sales and $50,000 profit, built three ways. High fixed costs buy low variable costs: profit swings harder when sales change.',

});

def({id:'scr',tab:'Scratch',group:'Work a new case',title:'Scratch sheet',sub:'Blank grid',free:true,
  intro:'A blank sheet for any problem. Type labels in column A and formulas anywhere: =B2*C2, =SUM(B2:B9), =IF(B5>0,B5*0.2,0), or reference another sheet such as =Theater_CVP!B11.',

/* ============================================================
   Compile sheets: assign addresses, names, resolve placeholders
   ============================================================ */
const SH={};const ORDER=[];
DEFS.forEach(d=>{
  const sh={id:d.id,tab:d.tab,def:d,cells:{},rows:[],names:{},rowNames:{},maxCol:d.free?8:2};
  if(d.rows){
    let r=0;
    d.rows.forEach(row=>{
      r++;const type=row[0];const RR={type,r,opts:{}};
      if(type==='h'||type==='t'){sh.cells['A'+r]={src:row[1],kind:'label'}}
      else if(type==='c'){sh.cells['A'+r]={src:row[1]||'',kind:'label'};row.slice(2).forEach((h,i)=>{if(h!=null&&h!=='')sh.cells[colName(i+1)+r]={src:h,kind:'colhead'}});sh.maxCol=Math.max(sh.maxCol,row.length-1)}
      else if(type==='r'){
        const label=row[1],cells=row[2],o=row[3]||{};RR.opts=o;
        sh.cells['A'+r]={src:label,kind:'label'};
        if(o.n)sh.rowNames[o.n]=r;
        cells.forEach((c,i)=>{if(c==null)return;const addr=colName(i+1)+r;const s=(typeof c==='object')?c:{v:c};
          sh.cells[addr]={src:s.v,fmt:s.f||o.f||'g',given:s.given||o.given,why:s.why,mis:s.mis||o.mis};if(s.n)sh.names[s.n]=addr});
        sh.maxCol=Math.max(sh.maxCol,cells.length+1);
      }
      sh.rows.push(RR);
    });
  }
  SH[d.id]=sh;ORDER.push(d.id);
});
function resolveName(sid,curAddr,token){
  // token forms: name | sheet:name | row@ | row@C | sheet:row@C
  let m=/^(?:([a-z0-9_]+):)?([A-Za-z0-9_]+)(@([A-Z]+)?)?$/.exec(token);if(!m)return null;
  const tsid=m[1]||sid,nm=m[2],sh=SH[tsid];if(!sh)return null;let addr=null;
  if(m[3]!==undefined){const r=sh.rowNames[nm];if(r==null)return null;const cl=m[4]||splitAddr(curAddr).cl;addr=cl+r}
  else addr=sh.names[nm]||null;
  if(!addr)return null;return tsid===sid?addr:sh.tab+'!'+addr;
}
const unresolved=[];
ORDER.forEach(sid=>{const sh=SH[sid];
  Object.entries(sh.cells).forEach(([addr,c])=>{
    if(c.kind==='label'||c.kind==='colhead'){c.raw=c.src;return}
    if(typeof c.src==='number'){c.raw=c.src;c.kind='input';return}
    if(typeof c.src==='string'&&c.src[0]==='='){
      c.raw=c.src.replace(/\{([^}]+)\}/g,(all,tok)=>{const a=resolveName(sid,addr,tok);if(!a){unresolved.push(sid+'!'+addr+' '+tok);return'#NAME'}return a});
      c.kind='formula';return}
    c.raw=c.src;c.kind='textin';
  });
});
if(unresolved.length)console.warn('Unresolved names',unresolved);
function nameAddr(sid,n){if(n.includes('@')){const[rn,cl]=n.split('@');const r=SH[sid].rowNames[rn];return r?cl+r:null}return SH[sid].names[n]||null}

/* ============================================================
   State and evaluation
   ============================================================ */
const KEY='acct65023-live-v1';
const ST={sheet:'ref',sel:null,practice:false,showF:false,edits:{},attempts:{},cls:{},clsShow:false,revealed:new Set()};
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s){ST.edits=s.edits||{};ST.attempts=s.attempts||{};ST.cls=s.cls||{};if(s.sheet&&SH[s.sheet])ST.sheet=s.sheet;ST.practice=!!s.practice}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify({edits:ST.edits,attempts:ST.attempts,cls:ST.cls,sheet:ST.sheet,practice:ST.practice}))}catch(e){}}
let cache=new Map();const visiting=new Set();
const invalidate=()=>{cache=new Map()};
function isEdited(sid,addr){return !!(ST.edits[sid]&&Object.prototype.hasOwnProperty.call(ST.edits[sid],addr))}
function rawOf(sid,addr){if(isEdited(sid,addr))return ST.edits[sid][addr];const c=SH[sid]&&SH[sid].cells[addr];return c?c.raw:''}
function getVal(sid,addr){
  const key=sid+'!'+addr;if(cache.has(key))return cache.get(key);
  if(visiting.has(key))return new Err('#CIRC!');
  const raw=rawOf(sid,addr);let v;
  if(raw==null||raw==='')v='';
  else if(typeof raw==='number')v=raw;
  else if(typeof raw==='string'&&raw[0]==='='){visiting.add(key);try{v=ev(parse(raw.slice(1)),sid);if(v&&v.range)v=new Err('#VALUE!')}catch(e){v=isErr(e)?e:new Err('#ERROR!')}visiting.delete(key)}
  else v=parseLiteral(raw);
  cache.set(key,v);return v;
}
function evalIn(sid,f){try{const v=ev(parse(f.replace(/^=/,'')),sid);return v&&v.range?new Err('#VALUE!'):v}catch(e){return isErr(e)?e:new Err('#ERROR!')}}
function metaOf(sid,addr){return SH[sid].cells[addr]||null}
function isFormula(sid,addr){const r=rawOf(sid,addr);return typeof r==='string'&&r[0]==='='}
function isMasked(sid,addr){const m=metaOf(sid,addr);return ST.practice&&m&&m.kind==='formula'&&!isEdited(sid,addr)&&!m.given&&!ST.revealed.has(sid+'!'+addr)}
function attemptState(sid,addr){
  const a=ST.attempts[sid]&&ST.attempts[sid][addr];if(a==null||a==='')return null;
  const truth=getVal(sid,addr);let av=a[0]==='='?evalIn(sid,a):parseLiteral(a);
  let ok=false;
  if(typeof truth==='number'&&typeof av==='number'){const tol=Math.max(0.002*Math.abs(truth),0.006);ok=Math.abs(av-truth)<=tol;
    const fm=(metaOf(sid,addr)||{}).fmt||'';if(!ok&&fm[0]==='%')ok=Math.abs(av/100-truth)<=Math.max(0.002*Math.abs(truth),0.0006)}
  else if(typeof truth==='string')ok=String(av).trim().toLowerCase()===truth.trim().toLowerCase();
  return{a,av,ok};
}
function fmtOf(sid,addr){const m=metaOf(sid,addr);return m&&m.fmt||'g'}

/* ============================================================
   UI
   ============================================================ */
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cur=()=>SH[ST.sheet];

    const o=document.createElement('option');o.value=id;o.textContent=d.title;if(id===ST.sheet)o.selected=true;og.appendChild(o);
  });
  $('side').innerHTML=html;
}

  ST.sheet=id;ST.sel=null;ST.revealed=new Set();save();
  document.querySelectorAll('#side button').forEach(b=>b.setAttribute('aria-current',b.dataset.s===id));

  const grid=!d.kind;
  $('gridArea').hidden=!grid;$('special').hidden=grid;
  if(grid){$('gsPanel').hidden=true;renderGrid();const first=selAddr||firstInput();selectCell(first,true)}
  else if(d.kind==='ref')renderRef();
  else if(d.kind==='classify')renderClassify();
  window.scrollTo({top:0});
}
function qsHtml(d){
  if(!d.qs||!d.qs.length)return'';
  return`<details class="qs" open><summary>Case questions</summary><ol>${d.qs.map(q=>`<li>${esc(q.q)}${q.a.map(n=>{const a=nameAddr(d.id,n);return a?`<button class="chipbtn" data-go="${a}">${a}</button>`:''}).join('')}</li>`).join('')}</ol></details>`;
}
$('shead').addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b){selectCell(b.dataset.go);$('gridWrap').focus({preventScroll:true})}});
function firstInput(){const sh=cur();for(const RR of sh.rows){for(let c=1;c<sh.maxCol;c++){const a=colName(c)+RR.r;const m=sh.cells[a];if(m&&m.kind==='input')return a}}return'B1'}

function cellView(sid,addr){
  const m=metaOf(sid,addr);const v=getVal(sid,addr);const cls=[];let txt='';
  const isLab=addr[0]==='A'&&/^A\d+$/.test(addr);
  if(isMasked(sid,addr)){
    cls.push('mask','fx');const at=attemptState(sid,addr);
    if(at){cls.pop();cls.push(at.ok?'ok':'no');txt=(at.ok?'✓ ':'✗ ')+display(at.av,fmtOf(sid,addr))}else txt='?';
    return{cls,txt};
  }
  const raw=rawOf(sid,addr);
  if(isFormula(sid,addr)){cls.push('fx');if(ST.showF){cls.push('showf');return{cls,txt:raw}}}
  else if(typeof raw==='number'||(m&&m.kind==='input'&&!isEdited(sid,addr))||(isEdited(sid,addr)&&typeof parseLiteral(raw)==='number'&&!isLab))cls.push('in');
  if(isEdited(sid,addr))cls.push('edited');
  txt=display(v,fmtOf(sid,addr));
  if(isErr(v))cls.push('err');else if(typeof v==='number'&&v<-1e-9&&!isLab)cls.push('neg');
  if(typeof v==='string'||isLab)cls.push('txt');
  return{cls,txt};
}
function renderGrid(){
  const sh=cur(),sid=sh.id,nC=sh.maxCol;const free=!!sh.def.free;
  let h='<thead><tr><th class="rn" scope="col"></th>';
  for(let c=0;c<nC;c++)h+=`<th scope="col">${colName(c)}</th>`;
  if(!free)h+='<th scope="col" class="meanh">What it means</th>';
  h+='</tr></thead><tbody>';
  sh.rows.forEach(RR=>{
    const r=RR.r,o=RR.opts||{};const trc=[RR.type,o.k==='total'?'total':''].join(' ');
    h+=`<tr class="${trc}"><th class="rn" scope="row">${r}</th>`;
    if(RR.type==='h'||RR.type==='t'){
      const cv=cellView(sid,'A'+r);h+=`<td class="ca span ${cv.cls.join(' ')}" data-a="A${r}" colspan="${nC}">${esc(cv.txt)}</td>`;
    }else{
      for(let c=0;c<nC;c++){const a=colName(c)+r;const cv=cellView(sid,a);h+=`<td class="${c===0?'ca ':''}${cv.cls.join(' ')}" data-a="${a}">${esc(cv.txt)}</td>`}
    }
    if(!free)h+=`<td class="mean">${esc(o.m||'')}</td>`;
    h+='</tr>';
  });
  h+='</tbody>';$('grid').innerHTML=h;
  if(ST.sel)paintSel();
  renderChart();renderScore();

}

function refsOf(sid,raw){

  for(let i=0;i<toks.length;i++){const t=toks[i];if(t.t!=='ref')continue;
    const tsid=t.sheet?(ORDER.find(x=>SH[x].tab.toLowerCase()===t.sheet.toLowerCase())||null):sid;if(!tsid)continue;
    if(toks[i+1]&&toks[i+1].v===':'&&toks[i+2]&&toks[i+2].t==='ref'){expandRange(t.a,toks[i+2].a).forEach(a=>out.push({sid:tsid,a}));i+=2}else out.push({sid:tsid,a:t.a})}

function wordsAndNumbers(sid,raw){
  let toks;try{toks=tokenize(raw.slice(1))}catch(e){return null}

    if(t.t==='ref'){
      const tsid=t.sheet?ORDER.find(x=>SH[x].tab.toLowerCase()===t.sheet.toLowerCase()):sid;
      if(toks[i+1]&&toks[i+1].v===':'&&toks[i+2]&&toks[i+2].t==='ref'){const t2=toks[i+2];const seg=s.slice(t.s,t2.e);words+=`[${tsid?labelFor(tsid,t.a):t.a} … ${tsid?labelFor(tsid,t2.a):t2.a}]`;nums+=seg;last=t2.e;i+=2;continue}
      if(tsid){const pre=t.sheet&&tsid!==sid?SH[tsid].def.title+': ':'';words+=`[${pre}${labelFor(tsid,t.a)}]`;nums+=display(getVal(tsid,t.a),fmtOf(tsid,t.a))||'0'}else{words+=s.slice(t.s,t.e);nums+=s.slice(t.s,t.e)}

$('gsRun').onclick=()=>{

  ST.edits[sid]=ST.edits[sid]||{};const had=isEdited(sid,inp),prev=ST.edits[sid][inp];

    msg.textContent=`Solved: ${inp} = ${display(xr,fmtOf(sid,inp))} makes ${t} = ${display(getVal(sid,t),fmtOf(sid,t))}. Restore it from the inspector or Reset sheet.`}

};

/* charts */
function niceTicks(min,max,n){const span=max-min||1;const step0=span/n;const mag=Math.pow(10,Math.floor(Math.log10(step0)));const st=[1,2,2.5,5,10].map(k=>k*mag).find(s=>s>=step0)||mag*10;
  const t=[];for(let v=Math.ceil(min/st)*st;v<=max+1e-9;v+=st)t.push(+v.toFixed(10));return t}
const compact=v=>{const a=Math.abs(v);if(a>=1e6)return(v/1e6).toLocaleString('en-US',{maximumFractionDigits:2})+'M';if(a>=1e3)return(v/1e3).toLocaleString('en-US',{maximumFractionDigits:1})+'k';return v.toLocaleString('en-US',{maximumFractionDigits:2})};
function renderChart(){
  const el=$('chart');const d=cur().def;if(!d.chart){el.innerHTML='';return}
  const sid=cur().id;const g=n=>{const a=nameAddr(sid,n);const v=a?toNum(getVal(sid,a)):NaN;return isErr(v)?NaN:v};
  let spec;try{spec=d.chart(g)}catch(e){el.innerHTML='';return}
  const W=760,Hh=330,ml=70,mr=24,mt=18,mb=46;const pw=W-ml-mr,ph=Hh-mt-mb;
  const all=spec.series.flatMap(s=>s.pts).concat(spec.marks||[]).filter(p=>Array.isArray(p)?isFinite(p[0])&&isFinite(p[1]):isFinite(p.x)&&isFinite(p.y));
  const ys=all.map(p=>Array.isArray(p)?p[1]:p.y);
  let xmin=spec.xmin??0,xmax=spec.xmax??Math.max(...all.map(p=>Array.isArray(p)?p[0]:p.x));
  let ymin=spec.ymin??Math.min(0,...ys),ymax=Math.max(...ys);if(!isFinite(ymax)||ymax<=ymin)ymax=ymin+1;
  const yt=niceTicks(ymin,ymax*1.05,5);ymin=Math.min(ymin,yt[0]);ymax=Math.max(yt[yt.length-1],ymax);
  const xt=niceTicks(xmin,xmax,6);
  const X=x=>ml+(x-xmin)/(xmax-xmin||1)*pw,Y=y=>mt+ph-(y-ymin)/(ymax-ymin||1)*ph;
  const col={brand:'var(--brand)',ink:'var(--ink)',muted:'var(--ink-3)',input:'var(--input)'};
  let s=`<svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="${esc(spec.title)}"><rect x="0" y="0" width="${W}" height="${Hh}" fill="none"/>`;
  yt.forEach(v=>{s+=`<line x1="${ml}" x2="${W-mr}" y1="${Y(v)}" y2="${Y(v)}" style="stroke:var(--line)" stroke-width="1"/><text x="${ml-8}" y="${Y(v)+5}" text-anchor="end" style="fill:var(--ink-3)" font-size="14">${compact(v)}</text>`});
  xt.forEach(v=>{if(v<xmin-1e-9||v>xmax+1e-9)return;s+=`<text x="${X(v)}" y="${Hh-mb+20}" text-anchor="middle" style="fill:var(--ink-3)" font-size="14">${compact(v)}</text>`});
  s+=`<line x1="${ml}" x2="${W-mr}" y1="${Y(Math.max(ymin,0))}" y2="${Y(Math.max(ymin,0))}" style="stroke:var(--line-strong)" stroke-width="1"/>`;
  s+=`<text x="${ml+pw/2}" y="${Hh-6}" text-anchor="middle" style="fill:var(--ink-2)" font-size="14">${esc(spec.xl)}</text>`;
  spec.series.forEach(se=>{const c=col[se.c]||'var(--ink)';const pts=se.pts.filter(p=>isFinite(p[0])&&isFinite(p[1]));
    if(se.scatter)pts.forEach(p=>{s+=`<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="5" style="fill:${c}"/>`});
    else s+=`<polyline points="${pts.map(p=>X(p[0])+','+Y(p[1])).join(' ')}" fill="none" style="stroke:${c}" stroke-width="${se.dash?1.5:2.5}" ${se.dash?'stroke-dasharray="6 5"':''}/>`});
  (spec.marks||[]).forEach(mk=>{if(!isFinite(mk.x)||!isFinite(mk.y))return;s+=`<circle cx="${X(mk.x)}" cy="${Y(mk.y)}" r="5" style="fill:var(--surface);stroke:var(--brand)" stroke-width="2"/>`;
    if(mk.l){const right=X(mk.x)<ml+pw*0.75;s+=`<text x="${X(mk.x)+(right?10:-10)}" y="${Y(mk.y)-10}" text-anchor="${right?'start':'end'}" style="fill:var(--ink)" font-size="14" font-weight="600">${esc(mk.l)} ${compact(mk.x)}</text>`}});
  s+='</svg>';
  el.innerHTML=`<div class="chart"><h3>${esc(spec.title)}</h3><div class="keys">${spec.series.map(se=>`<span><i style="background:${col[se.c]||'var(--ink)'};${se.dash?'opacity:.6':''}"></i>${esc(se.name)}</span>`).join('')}</div>${s}<p class="keynote">Redraws when you change an input.</p></div>`;
}

  let h=`<div class="notebox"><h3>How to use this workbook</h3><ul>
  <li>Each case is a live sheet. <b style="color:var(--input)">Blue</b> cells are inputs; change them and every formula updates, like Excel.</li>
  <li>Click any result to see its formula three ways: cell references, in words, and with the numbers. Cells it uses are shaded.</li>

  <li>Type a formula starting with <span class="kbd">=</span>. While typing, click a cell to insert its address. <span class="kbd">Enter</span> commits, arrows move, <span class="kbd">Ctrl</span>+<span class="kbd">\`</span> shows formulas.</li>
  <li><b>Copy with formulas</b> pastes straight into Excel at cell A1. Your edits stay in this browser only.</li></ul></div>
  <div class="tablewrap"><table class="ref"><thead><tr><th scope="col">Formula or rule</th><th scope="col">Meaning</th><th scope="col">Use when</th><th scope="col">Common mistake</th><th scope="col">Live cell</th></tr></thead><tbody>`;
  REF.forEach(r=>{if(r.length===1){h+=`<tr class="grp"><td colspan="5">${esc(r[0])}</td></tr>`;return}
    const a=nameAddr(r[4],r[5]);h+=`<tr><td class="f">${esc(r[0])}</td><td>${esc(r[1])}</td><td>${esc(r[2])}</td><td>${esc(r[3])}</td><td>${a?`<button class="chipbtn" data-os="${r[4]}" data-oa="${a}">${esc(SH[r[4]].def.title)} ${a}</button>`:''}</td></tr>`});

}
$('special').addEventListener('click',e=>{const b=e.target.closest('[data-os]');if(b)openSheet(b.dataset.os,b.dataset.oa)});

/* classify (Amethyst) */
const CLS=[
  ['Provider pay for completed care',['V'],['Direct'],['Y'],'Earned per completed visit. Saturday visits that are not rebooked stop generating pay.'],
  ['Front-desk / reception salary',['F'],['Indirect'],['D'],'Depends: relevant only if Saturday desk hours are paid separately or a position is cut. Salaried and kept: not relevant.'],
  ['Therapy supplies and materials',['V'],['Direct','Indirect'],['Y'],'Used per visit. Indirect if not tracked to individual visits.'],
  ['Rent on the two clinic locations',['F'],['Indirect'],['N'],'Lease continues whether or not Saturdays run.'],
  ['Owner / CEO salary',['F'],['Indirect'],['N'],'Paid regardless.'],
  ['EMR and scheduling software subscription',['F','Step'],['Indirect'],['N','D'],'Fixed subscription. Step and possibly relevant if priced per provider seat and Saturday-only providers are dropped.'],
  ['Professional-liability (malpractice) insurance',['F','Step'],['Indirect'],['N','D'],'Usually per provider per year. Relevant only if the premium depends on hours or provider count changes.'],
  ['Utilities (electricity, water)',['M'],['Indirect'],['Y'],'Base charge plus usage; closing Saturdays saves the usage part.'],
  ['Billing / claims-processing staff salary',['F'],['Indirect'],['N','D'],'Salaried. Relevant only if lower claim volume lets hours be cut.'],
  ['Continuing-education stipends for therapists',['F','Step'],['Indirect'],['N'],'Per therapist per year, not per visit.'],
  ['Interest on the clinic’s bank loan',['F'],['Indirect'],['N'],'Owed regardless of hours.'],
  ['Clinic build-out, already paid',['—'],['Indirect'],['N'],'Sunk: already spent, so it cannot be relevant.']
];
function renderClassify(){
  const opt=(arr,val)=>arr.map(o=>`<option${o===val?' selected':''}>${o}</option>`).join('');
  let h=`<div class="notebox"><h3>The assumption that decides relevance</h3><p style="margin:0">Do Saturday patients move to weekdays, or are they lost? If lost, the biggest relevant item is the contribution from those visits (revenue minus provider pay and supplies). If they move, most of that revenue is kept and few costs change at all.</p></div>
  <div class="toolbar"><button class="btn" id="cCheck" aria-pressed="${ST.clsShow}">${ST.clsShow?'Hide suggested answers':'Check against suggested answers'}</button><button class="btn" id="cClear">Clear my answers</button><span class="score" id="cScore"></span></div>
  <div class="tablewrap"><table class="ref"><thead><tr><th scope="col">Cost</th><th scope="col">Behavior with visits</th><th scope="col">Direct or indirect to a visit</th><th scope="col">Relevant to dropping Saturdays?</th>${ST.clsShow?'<th scope="col">Suggested answer and assumption</th>':''}</tr></thead><tbody>`;
  let ok=0,tot=0;
  CLS.forEach((c,i)=>{const a=ST.cls[i]||{};const chk=(k,keyArr)=>{if(!ST.clsShow||!a[k])return'';tot++;const good=keyArr.includes(a[k]);if(good)ok++;return good?'okc':'noc'};
    h+=`<tr><td class="f">${i+1}. ${esc(c[0])}</td>
      <td class="${chk('b',c[1])}"><select id="cb${i}" data-i="${i}" data-k="b" aria-label="Behavior">${opt(['','V','F','Step','M','—'],a.b)}</select></td>
      <td class="${chk('d',c[2])}"><select id="cd${i}" data-i="${i}" data-k="d" aria-label="Direct or indirect">${opt(['','Direct','Indirect'],a.d)}</select></td>
      <td class="${chk('r',c[3])}"><select id="cr${i}" data-i="${i}" data-k="r" aria-label="Relevant">${opt(['','Y','N','D'],a.r)}</select></td>
      ${ST.clsShow?`<td><b>${c[1].join(' / ')} · ${c[2].join(' / ')} · ${c[3].join(' / ')}</b><br>${esc(c[4])}</td>`:''}</tr>`});
  h+='</tbody></table></div><p class="keynote">V variable · F fixed · Step jumps at a capacity level · M mixed · — not a period cost (already paid). Y yes · N no · D depends (say on what).</p>';
  $('special').innerHTML=h;
  if(ST.clsShow)$('cScore').textContent=tot?`${ok} of ${tot} calls match`:'Make your calls, then compare.';
  $('special').querySelectorAll('select').forEach(s=>s.onchange=()=>{const i=s.dataset.i;ST.cls[i]=ST.cls[i]||{};ST.cls[i][s.dataset.k]=s.value;save();if(ST.clsShow)renderClassify()});
  $('cCheck').onclick=()=>{ST.clsShow=!ST.clsShow;renderClassify()};
  $('cClear').onclick=()=>{ST.cls={};save();renderClassify()};
}
